name: 'OpenSpec Store Check'
description: 'Store 的 PR 检查：openspec validate（改动部分 --strict）、需求状态约束（主分支不允许草稿）、执行类字段、受保护文件'
author: '0xYancy'

inputs:
  base-ref:
    description: '比较基准（默认 origin/<PR 目标分支>）'
    required: false
    default: ''
  author:
    description: 'PR 作者登录名，用于识别自动化 PR'
    required: false
    default: ${{ github.event.pull_request.user.login }}
  openspec-version:
    description: 'OpenSpec CLI 版本（与 framework.lock 一致）'
    required: false
    default: '1.12.0'

runs:
  using: 'composite'
  steps:
    - name: Install OpenSpec CLI
      shell: bash
      run: |
        python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check pyyaml
        npm install -g "@fission-ai/openspec@${{ inputs.openspec-version }}" >/dev/null

    - name: Validate specs and changes
      shell: bash
      env:
        OPENSPEC_TELEMETRY: '0'
      run: |
        # 全部内容做普通校验；本次 PR 改动的规范与活动 change 另做 --strict 校验。
        # 迁移进来的旧规范可能带有 strict 警告，只在被改动时才要求修正，不拦住无关的 PR。
        BASE="${{ inputs.base-ref }}"
        [ -z "$BASE" ] && BASE="origin/${{ github.base_ref || github.event.repository.default_branch }}"
        OUT="$RUNNER_TEMP/validate.txt"
        FAIL=0
        openspec validate --all > "$OUT" 2>&1 || FAIL=1
        CHANGED=$(git diff --name-only "$BASE"...HEAD)
        SPECS=$(echo "$CHANGED" | sed -nE 's#^openspec/specs/([^/]+)/spec\.md$#\1#p' | sort -u)
        CHANGES=$(echo "$CHANGED" | sed -nE 's#^openspec/changes/([^/]+)/.+#\1#p' | { grep -vx archive || true; } | sort -u)
        for s in $SPECS; do
          [ -f "openspec/specs/$s/spec.md" ] || continue
          echo "--- strict: spec $s" >> "$OUT"
          # Purpose 少于 50 个字符只作提醒（中文常常不足 50 个字符），其余严格校验问题照常失败
          python3 "${{ github.action_path }}/../shared/strict_spec.py" "$s" >> "$OUT" 2>&1 || FAIL=1
        done
        for c in $CHANGES; do
          [ -d "openspec/changes/$c" ] || continue
          echo "--- strict: change $c" >> "$OUT"
          openspec validate "$c" --type change --strict >> "$OUT" 2>&1 || FAIL=1
        done
        if [ "$FAIL" = 0 ]; then
          echo "### openspec validate 通过（全部普通校验；本次改动的规范与 change 为 --strict）" >> "$GITHUB_STEP_SUMMARY"
          grep '^提醒：' "$OUT" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
        else
          { echo "### openspec validate 未通过"; echo; echo '```'; tail -60 "$OUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT"
          exit 1
        fi

    - name: Check status, metadata and protected files
      shell: bash
      run: |
        BASE="${{ inputs.base-ref }}"
        [ -z "$BASE" ] && BASE="origin/${{ github.base_ref || github.event.repository.default_branch }}"
        python3 "${{ github.action_path }}/check.py" --store . --base-ref "$BASE" --author "${{ inputs.author }}" | tee -a "$GITHUB_STEP_SUMMARY"
        exit "${PIPESTATUS[0]}"
